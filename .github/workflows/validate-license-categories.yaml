name: Validate License Categories

on:
  pull_request:
    paths:
      - cmd/license-categories/**
      - spdxexp/spdxlicenses/**
      - packages/license-categories/**
      - go.mod
      - go.sum
      - Makefile
      - .github/workflows/validate-license-categories.yaml
      - .github/workflows/publish-license-categories.yaml
      - .github/workflows/fetch-licenses.yaml
  push:
    branches: [main]
    paths:
      - cmd/license-categories/**
      - spdxexp/spdxlicenses/**
      - packages/license-categories/**
      - go.mod
      - go.sum
      - Makefile
      - .github/workflows/validate-license-categories.yaml
      - .github/workflows/publish-license-categories.yaml
      - .github/workflows/fetch-licenses.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/license-categories/package-lock.json
      - name: Verify committed generated data
        run: make verify-license-categories
      - name: Install package dependencies
        run: npm ci
        working-directory: packages/license-categories
      - name: Test API, package tarball, and publication decisions
        run: npm test
        working-directory: packages/license-categories
