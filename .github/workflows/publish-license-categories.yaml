name: Publish License Categories

run-name: Publish License Categories - ${{ github.sha }}

on:
  workflow_dispatch:
  release:
    types: [released]

concurrency:
  group: publish-license-categories
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    if: vars.LICENSE_CATEGORIES_NPM_PUBLISH_ENABLED == 'true' && (github.event_name != 'release' || !github.event.release.prerelease)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Validate default branch
        if: github.event_name == 'workflow_dispatch' && github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          echo "::error::This workflow should only be run on the main branch."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: './go.mod'

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          scope: '@github'
          cache: npm
          cache-dependency-path: packages/license-categories/package-lock.json

      - name: Install OIDC-capable npm
        run: npm install -g npm@11.20.0

      - name: Verify generated license categories
        run: make verify-license-categories

      - name: Stamp go-spdx provenance
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process'
          import {readFileSync, writeFileSync} from 'node:fs'

          const provenance = process.env.EVENT_NAME === 'release'
            ? process.env.RELEASE_TAG
            : `${execFileSync('git', ['rev-parse', 'HEAD'], {encoding: 'utf8'}).trim()} (dispatch)`
          if (/[\r\n\u2028\u2029]/u.test(provenance)) throw new Error('go-spdx provenance must not contain line terminators')
          const path = 'packages/license-categories/src/generated.ts'
          const source = readFileSync(path, 'utf8')
          if (!/^\/\/ go-spdx: .+$/m.test(source)) throw new Error('Missing go-spdx provenance header')
          writeFileSync(path, source.replace(/^\/\/ go-spdx: .+$/m, () => `// go-spdx: ${provenance}`))
          NODE

      - name: Install dependencies
        run: npm ci
        working-directory: packages/license-categories

      - name: Test package
        run: npm test
        working-directory: packages/license-categories

      - name: Test package tarball
        run: npm run test:tarball
        working-directory: packages/license-categories

      - name: Compare published generated data
        id: comparison
        run: |
          node --input-type=module <<'NODE'
          import {appendFileSync} from 'node:fs'
          import {generatedDataChanged} from './script/compare-license-categories.mjs'

          const changed = await generatedDataChanged()
          appendFileSync(process.env.GITHUB_OUTPUT, `changed=${changed}\n`)
          NODE

      - name: Publish to npm using OIDC
        if: steps.comparison.outputs.changed == 'true'
        run: npm publish --access public --registry=https://registry.npmjs.org
        working-directory: packages/license-categories
        env:
          NPM_CONFIG_PROVENANCE: 'false'