name: "Build and test"

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: # Sometimes tests get stuck in PRs; This allows them to be rerun manually

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.24.7"

      - name: Build program
        run: go build ./...

      - name: Run tests
        run: go test -race ./...
